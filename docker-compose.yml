name: f1-pitwall

# ---------- shared fragments (DRY) ----------
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-python-service: &python-service
  restart: unless-stopped
  logging: *logging
  networks: [backend]

x-python-build: &python-build
  context: .
  dockerfile: services/Dockerfile

x-otel-env: &otel-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317

x-worker-env: &worker-env
  <<: *otel-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F?heartbeat=30

services:
  # ---------- data layer ----------
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-pitwall.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------- application ----------
  auth:
    <<: *python-service
    build:
      <<: *python-build
      args: { SERVICE: auth }
    image: f1-pitwall/auth:latest
    command: ["python", "-m", "auth_service"]
    environment:
      <<: *otel-env
      DATABASE_PATH: /data/auth.db
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-120}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - auth-data:/data
    healthcheck: &http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  race-engine:
    <<: *python-service
    build:
      <<: *python-build
      args: { SERVICE: race_engine }
    image: f1-pitwall/race-engine:latest
    command: ["python", "-m", "race_engine"]
    environment:
      <<: *worker-env
      RACE_SOURCE: ${RACE_SOURCE:-replay}
      REPLAY_RACES: ${REPLAY_RACES:-2024:Monza,2024:Silverstone,2024:Spa-Francorchamps}
      SPEED_FACTOR: ${SPEED_FACTOR:-20}
      OPENF1_CACHE_DIR: /data/openf1
    volumes:
      - openf1-cache:/data
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: &worker-healthcheck
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f\"http://localhost:{os.environ.get('METRICS_PORT', 9100)}/metrics\")"]
      interval: 15s
      timeout: 3s
      retries: 5

  race-control:
    <<: *python-service
    build:
      <<: *python-build
      args: { SERVICE: race_control }
    image: f1-pitwall/race-control:latest
    command: ["python", "-m", "race_control"]
    environment:
      <<: *worker-env
      METRICS_PORT: 9101
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *worker-healthcheck

  pitwall-api:
    <<: *python-service
    build:
      <<: *python-build
      args: { SERVICE: pitwall_api }
    image: f1-pitwall/pitwall-api:latest
    command: ["python", "-m", "pitwall_api"]
    environment:
      <<: *otel-env
      # Least privilege: SELECT-only database role.
      DATABASE_URL: postgresql://pitwall_api:${API_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck: *http-healthcheck

  # ---------- observability ----------
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS: ${EXPORTER_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.external-url=http://localhost:${GATEWAY_PORT:-8080}/prometheus/
      - --web.route-prefix=/prometheus
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/prometheus/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  tempo-init:
    # Tempo runs as uid 10001; a fresh named volume is owned by root.
    image: busybox:1.36
    user: root
    command: ["chown", "-R", "10001:10001", "/var/tempo"]
    volumes:
      - tempo-data:/var/tempo
    networks: [backend]

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    depends_on:
      tempo-init: { condition: service_completed_successfully }

  alloy:
    image: grafana/alloy:v1.4.3
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    environment:
      GF_SERVER_ROOT_URL: http://localhost:${GATEWAY_PORT:-8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Authentication is delegated to the gateway + auth service (auth proxy).
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_HEADERS: Role:X-WEBAUTH-ROLE
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_SIGNOUT_REDIRECT_URL: /auth/logout
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: ${ADMIN_USERNAME}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/f1-pit-wall.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_CONSOLE_FORMAT: json
      POSTGRES_DB: ${POSTGRES_DB}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki, tempo, postgres]

  # ---------- single entry point ----------
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth: { condition: service_healthy }
      pitwall-api: { condition: service_healthy }
      grafana: { condition: service_started }
      prometheus: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

networks:
  backend:

volumes:
  postgres-data:
  rabbitmq-data:
  auth-data:
  openf1-cache:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
