# API gateway: the only published port. Every protected request is verified by
# the auth service (auth_request) before it reaches Grafana, the API or admin tools.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    log_format json escape=json
        '{"ts":"$time_iso8601","level":"INFO","service":"gateway","remote":"$remote_addr",'
        '"user":"$auth_user","method":"$request_method","uri":"$uri","status":$status,'
        '"duration":$request_time,"upstream":"$upstream_addr"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Brute-force protection for the login form.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    upstream auth        { server auth:8000; }
    upstream pitwall_api { server pitwall-api:8000; }
    upstream grafana     { server grafana:3000; }
    upstream prometheus  { server prometheus:9090; }
    upstream rabbitmq    { server rabbitmq:15672; }

    server {
        listen 80;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = / {
            return 302 /grafana/;
        }

        # ---------- authentication subrequests ----------
        location = /_auth {
            internal;
            proxy_pass http://auth/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location = /_auth_admin {
            internal;
            proxy_pass http://auth/auth/verify?role=admin;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location @login {
            return 302 /auth/login?next=$uri;
        }

        location @unauthorized_json {
            default_type application/json;
            return 401 '{"detail":"Not authenticated. POST /auth/token to get a bearer token."}';
        }

        # ---------- public: authorization server ----------
        location = /auth/login {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://auth;
        }

        location /auth/ {
            proxy_pass http://auth;
        }

        # ---------- protected: Grafana (any authenticated user) ----------
        location /grafana/ {
            auth_request /_auth;
            auth_request_set $auth_user    $upstream_http_x_user;
            auth_request_set $grafana_role $upstream_http_x_grafana_role;
            error_page 401 = @login;

            # Overwrites anything the client may have sent: identity comes only from the auth service.
            proxy_set_header X-WEBAUTH-USER $auth_user;
            proxy_set_header X-WEBAUTH-ROLE $grafana_role;
            proxy_pass http://grafana;
        }

        location /grafana/api/live/ {
            auth_request /_auth;
            auth_request_set $auth_user    $upstream_http_x_user;
            auth_request_set $grafana_role $upstream_http_x_grafana_role;

            proxy_set_header X-WEBAUTH-USER $auth_user;
            proxy_set_header X-WEBAUTH-ROLE $grafana_role;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://grafana;
        }

        # ---------- protected: REST API (any authenticated user) ----------
        location /api/ {
            auth_request /_auth;
            auth_request_set $auth_user $upstream_http_x_user;
            auth_request_set $auth_role $upstream_http_x_role;
            error_page 401 = @unauthorized_json;

            proxy_set_header X-User $auth_user;
            proxy_set_header X-Role $auth_role;
            proxy_pass http://pitwall_api;
        }

        # ---------- protected: admin tools (admin role only) ----------
        location /prometheus/ {
            auth_request /_auth_admin;
            auth_request_set $auth_user $upstream_http_x_user;
            error_page 401 = @login;
            proxy_pass http://prometheus;
        }

        location /rabbitmq/ {
            auth_request /_auth_admin;
            auth_request_set $auth_user $upstream_http_x_user;
            error_page 401 = @login;
            proxy_pass http://rabbitmq;
        }
    }
}
